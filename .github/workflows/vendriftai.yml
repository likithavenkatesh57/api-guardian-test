name: VendriftAI
 
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — scan only, do not open PRs'
        type: boolean
        default: false
  pull_request:
    types: [closed]
  pull_request_review:
    types: [submitted, dismissed]
 
jobs:
  scan:
    name: Scan for API Updates
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.pull_request.title, '[VendriftAI]') ||
      startsWith(github.event.pull_request.title, '[API Guardian]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
 
    steps:
      - uses: actions/checkout@v4
 
      - uses: svudgimath/api-guardian@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: ${{ inputs.dry_run || false }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}