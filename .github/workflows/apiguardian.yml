name: VendriftAI
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the private tool's source code
        uses: actions/checkout@v4
        with:
          repository: svudgimath/api-guardian-main
          token: ${{ secrets.TOOL_REPO_PAT }}
          path: tool
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: tool/web/package-lock.json
      - name: Install the tool's dependencies
        run: npm ci
        working-directory: tool/web
      - name: Run API Guardian against this repo
        run: npx tsx action/index.ts
        working-directory: tool/web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_DRY_RUN: 'false'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
